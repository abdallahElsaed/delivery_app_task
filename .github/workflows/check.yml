name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 8.4 is the newest PHP every locked package supports (openspout caps at 8.4).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Only APP_KEY: .env.example leaves every key blank, and blank values
      # override Laravel's defaults (e.g. cache store "") when Larastan boots the app.
      - run: echo "APP_KEY=" > .env && php artisan key:generate

      - run: composer check
